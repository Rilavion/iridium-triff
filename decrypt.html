<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Архив • DECRYPT</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  background:#000;
  color:#e0e0e0;
  font-family:'Share Tech Mono',monospace;
  overflow-x:hidden;
}

main{position:relative;z-index:1}

.архив{display:none;width:100%;max-width:1200px;margin:0 auto;padding:40px 20px}
.архив.активен{display:block}

.поле-дела{position:relative;max-width:900px;margin:0 auto;padding:20px 10px}

.страницы{position:relative;display:flex;flex-direction:column;gap:40px;align-items:center}

.страница{
  position:relative;
  width:min(860px,100%);
  padding:44px 40px;
  background:linear-gradient(180deg,#ebe7df 0%,#ddd5c7 100%);
  box-shadow:0 14px 44px rgba(0,0,0,.45);
  overflow:hidden;
}
.страница:nth-child(odd){transform:rotate(-.6deg)}
.страница:nth-child(even){transform:rotate(.6deg)}

.поле-текста{position:relative;z-index:1}

.абзац{
  position:relative;
  margin:0 0 18px 0;
  color:#1e1a17;
  font-family:'Caveat',cursive;
  font-size:1.55rem;
  line-height:1.45;
  letter-spacing:.02em;
}
.абзац:last-child{margin-bottom:0}

.символ{
  display:inline-block;
  min-width:.02em;
  white-space:pre;
  transition:color .18s ease,text-shadow .18s ease,transform .1s ease;
}

.имя-участника{
  color:#4a6a9a;
  border-bottom:1px dashed rgba(74,106,154,.35);
  transition:color .2s,border-color .2s,text-shadow .2s;
  pointer-events:none;
}
.имя-участника.активно{
  pointer-events:auto;
  cursor:pointer;
  color:#7aaee0;
  border-bottom:1px solid rgba(122,174,224,.55);
  text-shadow:0 0 10px rgba(122,174,224,.2);
}

/* Prism */
.призма{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:20;
  width:min(720px,92vw);
  height:280px;
  background:rgba(2,4,3,.95);
  border:1px solid rgba(160,255,200,.32);
  box-shadow:0 0 60px rgba(0,0,0,.9),inset 0 0 40px rgba(0,0,0,.6);
  pointer-events:none;
  overflow:hidden;
}
/* no decorative pseudo-elements inside the prism */

.символ.внутри-призмы{
  color:#f5f5f5;
  text-shadow:0 0 6px rgba(255,255,255,.22);
}

@keyframes glitchChar{
  0%{transform:translate(0);text-shadow:none}
  20%{transform:translate(-1px,1px);text-shadow:-1px 0 #ff3333,1px 0 #00ff88}
  40%{transform:translate(1px,-1px);text-shadow:1px 0 #ff3333,-1px 0 #00ff88}
  60%{transform:translate(-1px,0);text-shadow:-1px 0 #00ff88,1px 0 #ff3333}
  80%{transform:translate(1px,1px);text-shadow:1px 0 #00ff88,-1px 0 #ff3333}
  100%{transform:translate(0);text-shadow:none}
}

.символ.глич{
  animation:glitchChar .14s infinite;
  color:#ff9999;
}
.символ.глич-имя{
  animation:glitchChar .07s infinite;
  color:#ff5555;
}

/* Dossier */
.досье{
  position:fixed;
  top:60px;
  right:-430px;
  width:400px;
  z-index:90;
  transition:right .5s cubic-bezier(.22,.8,.2,1);
}
.досье.активно{right:14px}

.лист-досье{
  position:relative;
  background:#050a08;
  border:1px solid rgba(100,255,180,.18);
  box-shadow:0 20px 60px rgba(0,0,0,.85);
  font-family:'Share Tech Mono',monospace;
  color:#9dffbf;
  overflow:hidden;
}
.лист-досье::before{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(0deg,rgba(160,255,200,.04) 0 2px,transparent 2px 4px);
  pointer-events:none;
  z-index:2;
  opacity:.5;
}

.верх-досье{
  position:relative;
  z-index:3;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  padding:16px 18px;
  border-bottom:1px solid rgba(100,255,180,.12);
}
.верх-досье h3{
  font-family:'Share Tech Mono',monospace;
  font-size:.95rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:#d7ffe4;
  line-height:1.4;
}
.верх-досье small{
  display:block;
  margin-top:6px;
  font-size:.6rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#5a8a6f;
}
.закрыть-досье{
  min-width:32px;
  height:32px;
  border:1px solid rgba(100,255,180,.2);
  background:transparent;
  color:#9dffbf;
  cursor:pointer;
  transition:.2s ease;
  font-family:'Share Tech Mono',monospace;
  font-size:.9rem;
}
.закрыть-досье:hover{background:rgba(100,255,180,.08)}

.фото-досье{
  position:relative;
  z-index:3;
  margin:0 18px 14px;
  border:1px solid rgba(100,255,180,.12);
  background:#000;
  overflow:hidden;
}
.фото-досье img{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:16/9;
  object-fit:cover;
  filter:grayscale(1) contrast(1.08) brightness(.85);
}

.поля-досье{
  position:relative;
  z-index:3;
  display:grid;
  gap:0;
  padding:0 18px 18px;
}
.поле-досье{
  padding:10px 0;
  border-bottom:1px solid rgba(100,255,180,.06);
  font-size:.82rem;
  line-height:1.6;
  color:#b8d0c0;
}
.поле-досье:last-child{border-bottom:none}
.поле-досье strong{
  display:block;
  font-size:.6rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#5a8a6f;
  margin-bottom:4px;
}

@media (max-width:900px){
  .досье{width:calc(100% - 28px);right:-120%}
  .досье.активно{right:14px}
}
@media (max-width:720px){
  .страница{padding:28px 22px}
  .абзац{font-size:1.35rem}
  .призма{height:220px}
}
@media (max-width:520px){
  .поле-дела{padding:10px 6px}
  .страница{padding:22px 18px}
  .абзац{font-size:1.25rem}
}
</style>
</head>
<body>

<main>
  <section class="архив" id="архив">
    <div class="поле-дела">
      <div class="страницы" id="страницы"></div>
      <div class="призма" id="призма"></div>
    </div>
  </section>
</main>

<div class="досье" id="досье">
  <div class="лист-досье">
    <div class="верх-досье">
      <div>
        <h3 id="имяДосье">досье</h3>
        <small>извлечено из уцелевшего архива</small>
      </div>
      <button class="закрыть-досье" id="закрытьДосье" type="button">✕</button>
    </div>
    <div class="фото-досье" id="фотоДосьеWrap"><img id="фотоДосье" src="" alt=""></div>
    <div class="поля-досье" id="поляДосье"></div>
  </div>
</div>

<script>
const чужойАлфавит = 'אבגדהוזחטיכלמנסעפצקרשתםףץןן״׳װױײ₪';
const азбука = '▓▒░█/#<>[]{}01ψΩΛЖЯÆИҰ∎◢◣◤◥';
const буквы = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЫЭЮЯ0123456789';

const страницыДанных = [
  [
    ['Детективное частное агентство “DECRYPT” так-же как и большинство нишевых организациях зародилось в секторе Спинвардская Периферия, в самой гуще развития мегаполиса на планете Y-27, первый основатель организации стал ', {member:'hiyoshi', text:'Хиоши Сузуки'}, ', прибывший на планету около 3х лет назад, на небольшой межтрансовом шаттле из солнечной системы. Начальный капитал организации составил 400.000$ наличными что были выделены Хиоши его родителями под залог, с ожиданием того что тот вернёт более 70% залога свыше, если не прогорит в сточной канаве планеты.'],
    ['Изначально агенство занималось конкретной поставленной задачей, принимая каждое предложение об детективной деятельности. В них часто входили уже клишированные запросы, слежка за второй половинкой которая подозревалась в измене, локальные потери вещей и небольших грабежей, по типу скрытия чей-то квартиры или съёмного жилья, снятие отпечатков, и поиски пропавших посылок утерянных местной почтовой службой.']
  ],
  [
    ['Этот нишевый бизнес буквально держался лишь на бытовых запросах ежедневно пытаясь выйти хоть на пару сотен долларов из долгов. За около чем более годовой работы таким темпом бизнес был приведён в ужасное состояние, помещение которое снимал Хиоши буквально трещало по швам пока арендодатель в очередной раз завышал цены аргументируя это очень просто “Город растёт - а мы теперь в центре его. Нет денег. Вали на окраину.”'],
    ['Это могло продолжаться буквально не более ещё двух месяцев, пока бы у Хиоши не кончились деньги, с учётом того что его родительский долг съедал более 80% заработка. Но тут как гром с небес появился шанс для малого бизнеса. Либо же до Хиоши самого дошла эта мысль, либо же ему дал очередную идею ежедневный клиент. А именно искать выгоду в корпоративных играх, пытаться заработать на добыче компромата против врагом той или иной фирмы обратившийся к нему, зачистки лишних данных или следов оставленных в ходе очередного “несчастного случая”.']
  ],
  [
    ['А учитывая что к этому времени город давно поделил сектриальный треугольник бизнесов, где самую вершину города занимали мега-корпорации, середину рынки получившие огласку в обществе, а дно подпольные рынки, нарко-базы, и стрип-клубы с провальными бизнесами. Работа была частно пыльной, и требующей поморать руки. Хиоши решил сразу же занять данный рынок, и перейти в политику нейтральных действий, усвоив одно простое правило “За каждым хищником следует свой охотник, и третий наблюдатель что будет пожинать кости обоих.” а название агентства как его основную направленность тот решил не менять в угоду некой конспирации от любопытных глаз правительство. Мол кому есть дело до очередного детектива-самоучки который рано или поздно найдет свою пулу в засанной подворотне.'],
    ['Данные решения позволили Хиоши с его бизнесом довольно резко начать свое развитие в высь по этажам города. И буквально за пол года такой работы, тот уже смог высунуть голову из канализации в средний сектор, ощутив менее черствый воздух пропитанный наркотой и героином. Первое задание их оказалось до ужасти просто, они получили его от фирмы по продаже средств по уходу за красотой, на другую такую-же фирму. Требовалось лишь сделать фотографии босса фирмы, находящегося в приватном клубе со страпоном не в том месте. И в отличии от низжевого рынка, на среднем рынке это могло реально повлиять на восприятие фирмы вплоть до обвала её акций. Дело тот закрыл быстро и без проблем, что пробило ему сразу небольшие но значительные связи на среднем плато.']
  ],
  [
    ['К тому моменту тот уже начал предпринимать движение в найме дополнительных сотрудников, уверенности естественно в каждом новом не было, и Хиоши понимал что каждый из них может подставить его в любой момент, но это всяко лучше когда предатель прикрывает спину от врага, чем враг смотрящий сквозь дырку в твоем сердце. Первый состав команды был из трёх существ разных расс, аркана девушка, ярко-розового окраса - ', {member:'cadence', text:'Каденс Слоан'}, ', мужчина человеческой расы ', {member:'iridium', text:'Иридий'}, ' с серебряными волосами, и мужчина вульпканин ', {member:'daros', text:'Дарос Полей'}, '.'],
    ['И если вульпу с арканой Хиоши смог достать буквально с подворотен нижнего плато, человека ему подослал один из знакомых, чьи заказы он уже не раз выполнял со среднего плато. И найм новых сотрудников стал для организации буквально вторым дыханием, это позволило брать на пару заказов больше, а учитывая что с приходом ', {member:'iridium', text:'Иридия'}, ', у них ещё и появился автотранспорт который по явному согласию всех сторон стал принадлежать организации. С того момента их влияние начало расходится по среднему плато, начиная с ежедневных заданий по сборке компромата, заканчиваю уже прямым созданием самого этого компромата.'],
    [{damaged:true, text:'Я<]#1}01 организация развилась и ◢◤◣}1/<1Æ получила свой первый и ÆЯ█00}<Æ заказ от'}]
  ]
];

const досьеДанные = {
  hiyoshi:{name:'Хиоши Сузуки', photo:'hiyoshi-elevator.png', fields:[['ФИО','Хиоши Сузуки'],['пол','мужской'],['раса','человек'],['рост','178 см'],['вес','71 кг'],['статус','след оборван'],['родная планета','Земля / солнечная система'],['краткая характеристика','Основатель. Поднял агентство из бытового сыска в рынок корпоративной грязи, предпочитая дробить заказы так, чтобы никто не видел всей картины целиком.']]},
  cadence:{name:'Каденс Слоан', photo:'arcana-cigarettes.jpeg', fields:[['ФИО','Каденс Слоан'],['пол','женский'],['раса','аркана'],['рост','171 см'],['вес','57 кг'],['статус','последний след нестабилен'],['родная планета','не зафиксирована'],['краткая характеристика','Полевой элемент. Сцены вокруг неё выглядят бытовыми, но именно через такие места в архиве чаще всего начинается чужой компромат.']]},
  iridium:{name:'Иридий', photo:'iridium-elevator.png', fields:[['ФИО','Иридий'],['пол','мужской'],['раса','человек'],['рост','188 см'],['вес','79 кг'],['статус','следы разорваны'],['родная планета','Ме▓р◢к█уÆрЯи01-█◣'],['краткая характеристика','Принёс агентству подвижность. Возникает рядом с узлами вывоза, передачи и слишком быстрым исчезновением хвостов.']]},
  daros:{name:'Дарос Полей', photo:'', fields:[['ФИО','Дарос Полей'],['пол','мужской'],['раса','вульпканин'],['рост','182 см'],['вес','68 кг'],['статус','данные неполные'],['родная планета','не подтверждена'],['краткая характеристика','Связан с частотами, служебными проходами, запасными ключами и нижним плато. От него осталось меньше лица, чем метода.']]}
};

const архив = document.getElementById('архив');
const страницы = document.getElementById('страницы');
const призма = document.getElementById('призма');
const досье = document.getElementById('досье');
const имяДосье = document.getElementById('имяДосье');
const фотоДосье = document.getElementById('фотоДосье');
const фотоДосьеWrap = document.getElementById('фотоДосьеWrap');
const поляДосье = document.getElementById('поляДосье');

let глифы = [];
let участники = {};

function случайныйСимвол(){return азбука[Math.floor(Math.random()*азбука.length)]}
function случайнаяБуква(){return буквы[Math.floor(Math.random()*буквы.length)]}
function чужаяБуква(){return чужойАлфавит[Math.floor(Math.random()*чужойАлфавит.length)]}
function испорченный(real){
  if(/[0-9]/.test(real)) return String(Math.floor(Math.random()*10));
  if(/[A-Za-zА-Яа-яЁё]/.test(real)) return чужаяБуква();
  if(/[.,:;!?\-—()«»"'`]/.test(real)) return случайныйСимвол();
  return Math.random()>.5 ? чужаяБуква() : случайныйСимвол();
}

function создатьГлиф(char, meta={}){
  const span = document.createElement('span');
  span.className = 'символ';
  span.dataset.real = char;
  if(meta.damaged){
    span.dataset.damaged = '1';
    span.dataset.base = char.split('').map(ch => /[A-Za-zА-Яа-яЁё0-9]/.test(ch) ? чужаяБуква() : ch).join('');
  } else {
    span.dataset.base = испорченный(char);
  }
  span.textContent = span.dataset.base;
  if(meta.damaged) span.dataset.damaged = '1';
  if(meta.member) span.dataset.member = meta.member;
  return span;
}

function добавитьФрагмент(parent, part){
  if(typeof part === 'string'){
    for(const ch of part){
      if(ch === ' ') parent.appendChild(document.createTextNode(' '));
      else parent.appendChild(создатьГлиф(ch));
    }
    return;
  }
  if(part.member){
    const wrap = document.createElement('span');
    wrap.className = 'имя-участника';
    wrap.dataset.member = part.member;
    if(!участники[part.member]) участники[part.member] = {el:wrap,total:0,visible:0};
    for(const ch of part.text){
      if(ch === ' ') wrap.appendChild(document.createTextNode(' '));
      else {
        const g = создатьГлиф(ch,{member:part.member});
        wrap.appendChild(g);
        участники[part.member].total++;
      }
    }
    wrap.addEventListener('click', ()=>{ if(wrap.classList.contains('активно')) открытьДосье(part.member); });
    parent.appendChild(wrap);
    return;
  }
  if(part.damaged){
    for(const ch of part.text){
      if(ch === ' ') parent.appendChild(document.createTextNode(' '));
      else parent.appendChild(создатьГлиф(ch,{damaged:true}));
    }
  }
}

function построитьСтраницы(){
  страницы.innerHTML = '';
  участники = {};
  глифы = [];
  страницыДанных.forEach(pageData=>{
    const page = document.createElement('div');
    page.className = 'страница';
    const field = document.createElement('div');
    field.className = 'поле-текста';
    pageData.forEach(par=>{
      const p = document.createElement('p');
      p.className = 'абзац';
      par.forEach(part=>добавитьФрагмент(p, part));
      field.appendChild(p);
    });
    page.appendChild(field);
    страницы.appendChild(page);
  });
  requestAnimationFrame(измеритьГлифы);
}

function измеритьГлифы(){
  const sRect = страницы.getBoundingClientRect();
  глифы = Array.from(страницы.querySelectorAll('.символ')).map(el=>{
    const r = el.getBoundingClientRect();
    return {
      el, real:el.dataset.real, base:el.dataset.base,
      damaged:el.dataset.damaged==='1', member:el.dataset.member||null,
      x:r.left-sRect.left+r.width/2, y:r.top-sRect.top+r.height/2,
      progress:0
    };
  });
}

function открытьДосье(key){
  const data = досьеДанные[key];
  if(!data) return;
  имяДосье.textContent = data.name;
  if(data.photo){
    фотоДосье.src = data.photo;
    фотоДосье.alt = data.name;
    фотоДосьеWrap.style.display = 'block';
  } else {
    фотоДосьеWrap.style.display = 'none';
  }
  поляДосье.innerHTML = '';
  data.fields.forEach(([k,v])=>{
    const row = document.createElement('div');
    row.className = 'поле-досье';
    row.innerHTML = `<strong>${k}</strong><div>${v}</div>`;
    поляДосье.appendChild(row);
  });
  досье.classList.add('активно');
}

function закрытьДосье(){ досье.classList.remove('активно'); }

document.getElementById('закрытьДосье').addEventListener('click', закрытьДосье);

function обновитьЧтение(){
  const pRect = призма.getBoundingClientRect();
  const sRect = страницы.getBoundingClientRect();
  const px1 = pRect.left, px2 = pRect.right, py1 = pRect.top, py2 = pRect.bottom;

  Object.values(участники).forEach(v=>v.visible=0);

  for(const g of глифы){
    const gx = g.x + sRect.left;
    const gy = g.y + sRect.top;
    const inRect = gx >= px1 && gx <= px2 && gy >= py1 && gy <= py2;
    if(inRect){
      g.progress = Math.min(1, g.progress + (g.damaged ? .05 : .065));
      g.el.classList.add('внутри-призмы');

      if(g.progress < 0.45){
        g.el.classList.add('глич');
        if(g.member) g.el.classList.add('глич-имя');
        g.el.textContent = Math.random()>.4 ? случайныйСимвол() : чужаяБуква();
      } else if(g.progress < 0.72){
        g.el.classList.remove('глич','глич-имя');
        g.el.textContent = Math.random()>.45 ? g.real : чужаяБуква();
      } else if(g.progress < 0.9){
        g.el.classList.remove('глич','глич-имя');
        g.el.textContent = Math.random()>.22 ? g.real : испорченный(g.real);
      } else {
        g.el.classList.remove('глич','глич-имя');
        g.el.textContent = g.real;
      }

      if(g.member && участники[g.member]) участники[g.member].visible += g.progress;
    } else {
      g.progress = 0;
      g.el.classList.remove('внутри-призмы','глич','глич-имя');
      g.el.textContent = g.base;
    }
  }

  Object.keys(участники).forEach(key=>{
    const d = участники[key];
    d.el.classList.toggle('активно', d.total ? (d.visible / d.total) > .55 : false);
  });
}

setInterval(обновитьЧтение, 60);

window.addEventListener('resize', ()=>{
  if(архив.classList.contains('активен')) requestAnimationFrame(измеритьГлифы);
});

window.addEventListener('scroll', ()=>{
  if(архив.classList.contains('активен')) requestAnimationFrame(измеритьГлифы);
}, {passive:true});

document.addEventListener('DOMContentLoaded', ()=>{
  построитьСтраницы();
  архив.classList.add('активен');
});
</script>
